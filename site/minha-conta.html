<script>
(function () {
  try {
    var root = document.documentElement;
    var btns = document.querySelectorAll(".theme-btn");
    var dark = root.getAttribute("data-theme") === "dark";
    btns.forEach(function (b) { b.setAttribute("aria-pressed", dark ? "true" : "false"); });
    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest(".theme-btn") : null;
      if (!b) return;
      e.preventDefault();
      var next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
      root.setAttribute("data-theme", next);
      try { localStorage.setItem("rc_theme", next); } catch (err) {}
      btns.forEach(function (x) { x.setAttribute("aria-pressed", next === "dark" ? "true" : "false"); });
    });
  } catch (e) {}
})();
</script>
<script>
(function () {
  "use strict";
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function show(html) { document.getElementById("box").innerHTML = html; }
  function render() {
    if (!window.RC_auth || !window.RC_auth.enabled) {
      show("<p class='sub'>Conta indisponível agora. Volte ao <a href='index.html#converter'>conversor</a>.</p>");
      return;
    }
    var u = window.RC_auth.user();
    document.getElementById("actions").hidden = false;
    if (!u) {
      document.getElementById("logout").hidden = true;
      show("<p class='sub'>Você ainda não entrou. É rapidinho: um clique com sua conta Google e seu VIP fica guardado nela.</p>" +
        "<button class='btn-ghost' id='goLogin' type='button' style='width:100%;background:#fff;font-weight:700'>Continuar com Google</button>");
      document.getElementById("goLogin").addEventListener("click", function () { window.RC_auth.openModal(); });
      return;
    }
    document.getElementById("logout").hidden = false;
    show("<p><b>" + esc(u.name || "") + "</b> · " + esc(u.email || "") + "</p><p class='sub'>Verificando seu plano…</p>");
    if (window.RC_entitlements) {
      window.RC_entitlements.load().then(function (ent) {
        if (ent.status !== "ready") throw new Error("Entitlement response unavailable.");
        var active = !!ent.active;
        var limit = ent.max_file_mb === null ? "sem limite comercial" : ent.max_file_mb + " MB";
        var until = ent.expires_at ? new Date(ent.expires_at).toLocaleDateString("pt-BR") : "";
        var pendingAction = "";
        if (ent.pending_payment && /^https:\/\//i.test(String(ent.pending_payment.checkout_url || ""))) {
          pendingAction = "<p><a class='btn-ghost' href='" + esc(ent.pending_payment.checkout_url) + "' target='_blank' rel='noopener'>Abrir pagamento existente</a></p>";
        } else if (ent.pending_payment && ent.pending_payment.provider === "depix" && ent.pending_payment.status === "checkout_creation_uncertain") {
          pendingAction = "<p><button class='btn-ghost' id='resumePendingPayment' type='button'>Retomar a criação do Pix</button></p>";
        }
        var details = "<p><b>Plano atual:</b> " + esc(ent.plan_label || ent.plan || "Plano gratuito") + "</p>" +
          "<p><b>Status:</b> " + (active ? "Ativo" : "Gratuito") + (until ? " · <b>Expira:</b> " + esc(until) : "") + "</p>" +
          (ent.plan === "world1" ? "<p><b>Créditos de mundo:</b> " + (+ent.world_credits || 0) + " · <b>Projetos ativos:</b> " + (+ent.active_world_projects || 0) + "</p><p><b>Limite por mundo:</b> " + esc(limit) + "</p>" : "<p><b>Limite por mundo:</b> " + esc(limit) + "</p>");
        if (ent.pending_payment) details += "<p class='sub'><b>" + (ent.pending_payment.status === "checkout_creation_uncertain" ? "Cobrança em confirmação:" : "Pagamento em confirmação:") + "</b> " + esc(window.RC_entitlements.messageForPending(ent.pending_payment)) + "</p>";
        show("<p><b>" + esc(u.name || "") + "</b> · " + esc(u.email || "") + "</p>" + details + pendingAction +
          "<p><button class='btn-ghost' id='refreshBenefits' type='button'>Atualizar benefícios</button></p>" +
          (active ? "<p><a href='index.html#converter'><b>Ir converter</b></a></p>" : (ent.pending_payment ? "" : "<p class='sub'><a href='index.html#planos'><b>Ver planos</b></a> para mundos maiores e recursos extras.</p>")));
        var resume = document.getElementById("resumePendingPayment");
        if (resume) resume.onclick = function () { resume.disabled = true; if (window.RC_pay) window.RC_pay.checkout(ent.pending_payment.plan, null); };
        var refresh = document.getElementById("refreshBenefits");
        if (refresh) refresh.onclick = function () { refresh.disabled = true; window.RC_entitlements.refresh().then(render).catch(render); };
      }).catch(function (error) {
        var message = window.RC_entitlements.messageForError(error);
        show("<p><b>" + esc(u.name || "") + "</b> · " + esc(u.email || "") + "</p><p class='sub'>" + esc(message) + "</p><p><button class='btn-ghost' id='refreshBenefits' type='button'>Atualizar benefícios</button></p>");
        var refresh = document.getElementById("refreshBenefits");
        if (refresh) refresh.onclick = function () { window.RC_entitlements.refresh().then(render).catch(render); };
      });
      return;
    }
  }
  document.getElementById("logout").addEventListener("click", function () {
    if (!window.confirm("Sair da conta?")) return;
    window.RC_auth.signOut().then(render);
  });
  if (window.RC_auth) window.RC_auth.onChange(render);
  render();
})();
</script>
