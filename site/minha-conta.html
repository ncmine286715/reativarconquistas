<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minha conta — ReativaConquistas</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="stylesheet" href="style.css">
<script>try{var t=localStorage.getItem("rc_theme");if(t!=="dark"&&t!=="light")t="light";document.documentElement.setAttribute("data-theme",t);}catch(e){document.documentElement.setAttribute("data-theme","light");}</script>
</head>
<body>
<div class="topbar"><div class="topbar-in">
<a class="brand" href="index.html"><img src="logo.png" width="30" height="30" alt="ReativaConquistas" style="border-radius:8px;display:block"><span>ReativaConquistas<small>minha conta</small></span></a>
<nav class="nav"><a href="index.html#converter">Converter</a><a href="index.html#planos">Planos</a><button class="theme-btn" type="button" aria-pressed="false" aria-label="Alternar modo escuro"><svg class="ic ic-moon" viewBox="0 0 16 16" aria-hidden="true"><path d="M11 2a6 6 0 0 0 3 8 6 6 0 0 1-8-3 6 6 0 0 1 5-5z" fill="currentColor"/></svg><svg class="ic ic-sun" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 6h4v4H6z M7 1h2v2H7z M7 13h2v2H7z M1 7h2v2H1z M13 7h2v2h-2z" fill="currentColor"/></svg></button></nav>
</div></div>
<div class="page" style="max-width:640px">
<div class="card" style="margin-top:26px">
<h2>Minha conta</h2>
<div id="box"><p class="sub">Carregando…</p></div>
<div class="row2" id="actions" style="display:flex;gap:10px;margin-top:12px;flex-wrap:wrap" hidden>
<a class="btn-ghost" href="index.html#converter" style="flex:1;text-align:center;text-decoration:none">Converter</a>
<a class="btn-ghost" href="index.html#planos" style="flex:1;text-align:center;text-decoration:none">Ver planos</a>
<button class="btn-ghost" id="logout" type="button" style="flex:1" hidden>Sair</button>
</div>
</div>
</div>
<script src="config.js?v=20"></script>
<script src="firebase-config.js?v=13"></script>
<script src="auth.js?v=14"></script>
<script src="pagamento.js?v=14"></script>
<script>
(function () {
  try {
    var root = document.documentElement;
    var btns = document.querySelectorAll(".theme-btn");
    var dark = root.getAttribute("data-theme") === "dark";
    btns.forEach(function (b) { b.setAttribute("aria-pressed", dark ? "true" : "false"); });
    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest(".theme-btn") : null;
      if (!b) return;
      e.preventDefault();
      var next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
      root.setAttribute("data-theme", next);
      try { localStorage.setItem("rc_theme", next); } catch (err) {}
      btns.forEach(function (x) { x.setAttribute("aria-pressed", next === "dark" ? "true" : "false"); });
    });
  } catch (e) {}
})();
</script>
<script>
(function () {
  "use strict";
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function show(html) { document.getElementById("box").innerHTML = html; }
  function freeLimitLabel() {
    try {
      var c = window.RC_CONFIG || {};
      var promo = c.PROMO_UNTIL && c.PROMO_MAX_MB && Date.now() < new Date(c.PROMO_UNTIL).getTime();
      return (promo ? c.PROMO_MAX_MB : (c.FREE_MAX_MB || 10)) + " MB";
    } catch (e) { return "o limite grátis atual"; }
  }
  function render() {
    if (!window.RC_auth || !window.RC_auth.enabled) {
      show("<p class='sub'>Conta indisponível agora. Volte ao <a href='index.html#converter'>conversor</a>.</p>");
      return;
    }
    var u = window.RC_auth.user();
    document.getElementById("actions").hidden = false;
    if (!u) {
      document.getElementById("logout").hidden = true;
      show("<p class='sub'>Você ainda não entrou. É rapidinho: um clique com sua conta Google e seu VIP fica guardado nela.</p>" +
        "<button class='btn-ghost' id='goLogin' type='button' style='width:100%;background:#fff;font-weight:700'>Continuar com Google</button>");
      document.getElementById("goLogin").addEventListener("click", function () { window.RC_auth.openModal(); });
      return;
    }
    document.getElementById("logout").hidden = false;
    show("<p><b>" + esc(u.name || "") + "</b> · " + esc(u.email || "") + "</p><p class='sub'>Verificando VIP…</p>");
    var emails = [];
    try {
      var le = (localStorage.getItem("rc_prem_email") || "").trim().toLowerCase();
      if (u.email) emails.push(u.email.trim().toLowerCase());
      if (le && emails.indexOf(le) < 0) emails.push(le);
    } catch (e) { if (u.email) emails.push(u.email.trim().toLowerCase()); }
    var pending = emails.length, best = 0, okAny = false;
    if (!pending) {
      show("<p><b>" + esc(u.name || "") + "</b> · " + esc(u.email || "") + "</p>" +
        "<p><b>Plano:</b> Grátis (mundos até " + freeLimitLabel() + ", 2 por dia)</p>" +
        "<p class='sub'><a href='index.html#planos'><b>Assinar o VIP</b></a> para mundos gigantes e recursos extras.</p>");
      return;
    }
    emails.forEach(function (em) {
      window.RC_pay.remotePremiumMs(em).then(function (ms) {
        okAny = true;
        if (+ms > best) best = +ms;
      }).catch(function () {}).then(function () {
        if (--pending) return;
        if (!okAny) {
          show("<p><b>" + esc(u.name || "") + "</b> · " + esc(u.email || "") + "</p>" +
            "<p class='sub'>Sem conexão com o servidor agora. <a href='#' id='retryVip'><b>Tentar de novo</b></a></p>");
          document.getElementById("retryVip").addEventListener("click", function (e) { e.preventDefault(); render(); });
          return;
        }
        var prem = best > Date.now();
        try {
          if (prem) localStorage.setItem("rc_prem_remote", JSON.stringify({ until: best, email: u.email }));
          else if (!((JSON.parse(localStorage.getItem("rc_prem_remote") || "null") || {}).until > Date.now())) localStorage.removeItem("rc_prem_remote");
        } catch (e) {}
        show("<p><b>" + esc(u.name || "") + "</b> · " + esc(u.email || "") + "</p>" +
          "<p><b>Plano:</b> " + (prem
            ? "VIP até <b>" + new Date(best).toLocaleDateString("pt-BR") + "</b> · <a href='index.html#converter'><b>Ir converter</b></a>"
            : "Grátis (mundos até " + freeLimitLabel() + ", 2 por dia)") + "</p>" +
          (prem ? "" : "<p class='sub'><a href='index.html#planos'><b>Assinar o VIP</b></a> para mundos gigantes e recursos extras.</p>") +
          "<p class='sub'>Pagou com <b>outro e-mail</b> (ex.: na Kiwify)? <a href='#' id='linkEmail'><b>Vincular e-mail do pagamento</b></a> · <a href='#' id='retryVip'>Verificar de novo</a></p>");
        document.getElementById("retryVip").addEventListener("click", function (e) { e.preventDefault(); render(); });
        document.getElementById("linkEmail").addEventListener("click", function (e) {
          e.preventDefault();
          var cur = "";
          try { cur = localStorage.getItem("rc_prem_email") || ""; } catch (e2) {}
          var em2 = window.prompt("Qual e-mail você usou no pagamento? (o VIP vale nele)", cur);
          if (em2 === null) return;
          em2 = String(em2).trim().toLowerCase();
          if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em2)) { alert("Informe um e-mail válido."); return; }
          show("<p class='sub'>Verificando VIP em " + esc(em2) + "…</p>");
          window.RC_pay.remotePremiumMs(em2).then(function (ms2) {
            if (+ms2 > Date.now()) {
              try {
                localStorage.setItem("rc_prem_email", em2);
                localStorage.setItem("rc_prem_remote", JSON.stringify({ until: +ms2, email: em2 }));
              } catch (e3) {}
              render();
            } else {
              alert("Nenhum VIP ativo em " + em2 + ". Confira o e-mail do pagamento.");
              render();
            }
          }).catch(function () { alert("Sem conexão agora. Tente de novo em instantes."); render(); });
        });
      });
    });
  }
  document.getElementById("logout").addEventListener("click", function () {
    if (!window.confirm("Sair da conta?")) return;
    window.RC_auth.signOut().then(render);
  });
  if (window.RC_auth) window.RC_auth.onChange(render);
  render();
})();
</script>
</body>
</html>
