name = "reativa-pay"
main = "src/index.js"
compatibility_date = "2024-11-01"

# KV com pendentes + premium por e-mail (crie 1x: wrangler kv namespace create PREMIUM_KV).
# Depois cole o id retornado abaixo (preview_id p/ dev, id p/ produção).
[[kv_namespaces]]
binding = "PREMIUM_KV"
id = "acfc4981776e4dd0b8513722597f8f01"
preview_id = "acfc4981776e4dd0b8513722597f8f01"

[vars]
# ID do produto "VIP 30 dias" no dashboard AbacatePay (obrigatório p/ abc_dev_).
ABACATEPAY_PRODUCT_ID = "prod_ZC3tefGJJZtyGBPqyYdgq5Yk"
# ID do produto "Passe 24h" (R$ 5,90) no dashboard AbacatePay.
ABACATEPAY_PRODUCT_ID_24H = "prod_sfQEAQQcWr2P2UtJG4yqUsSq"
# IDs dos produtos na KIWIFY (só quando ligar a Kiwify): produto -> Webhooks.
# Vazios = Kiwify desligada. Dias: _24H = 1 dia, _30D = 30 dias.
KIWIFY_PID_24H = ""
KIWIFY_PID_30D = ""
# Site público (volta do checkout). Troque pelo seu domínio em produção.
PUBLIC_BASE_URL = "https://reativarconquistas.pages.dev"
# Segredo do webhook (NÃO vai neste arquivo! gravado via API como secret):
#   https://<seu-worker>/api/abacate/webhook?secret=VALOR — cadastre no AbacatePay.
# Origens liberadas p/ o site chamar o Worker (CSV; "*.dominio" cobre previews).
# Inclui o workers.dev da sua conta (caso acesse o site por lá) — o oficial é o pages.dev.
ALLOWED_ORIGINS = "https://reativarconquistas.pages.dev, *.reativarconquistas.pages.dev, https://reativarconquistas.rosidomingos032.workers.dev"

# SEGREDOS (nunca neste arquivo! cada um via `wrangler secret put NOME`):
#   wrangler secret put DEPIX_API_KEY        -> sk_test_... (teste) ou sk_live_... (produção)
#   wrangler secret put DEPIX_WEBHOOK_SECRET -> whsec_... (painel Depix > My Business > Webhooks)
#   wrangler secret put ABACATEPAY_API_KEY   -> abc_dev_... (dev) ou abc_... (produção, reserva)
# e cole cada valor quando o wrangler pedir (não aparece no terminal).
#
# MODO TESTE: com sk_test_ no DEPIX_API_KEY, o Worker já responde
# depix_test_mode=true no /api/config e o site mostra o aviso de teste.
# Simular pagamento aprovado: POST /api/depix/simulate {id: "chk_..."}.

# continuação de [vars]
# "1" = teste (site mostra aviso); "0"/vazio = produção.
DEPIX_TEST_MODE = "0"
