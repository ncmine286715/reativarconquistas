# Site público (volta do checkout). Troque pelo seu domínio em produção.
PUBLIC_BASE_URL = "https://worldify.com.br"
# Segredo do webhook (NÃO vai neste arquivo! gravado via API como secret):
#   https://<seu-worker>/api/abacate/webhook?secret=VALOR — cadastre no AbacatePay.
# Origens liberadas p/ o site chamar o Worker (CSV; "*.dominio" cobre previews).
# Inclui o workers.dev da sua conta (caso acesse o site por lá) — o oficial é o pages.dev.
ALLOWED_ORIGINS = "https://worldify.com.br, https://reativarconquistas.pages.dev, *.reativarconquistas.pages.dev, https://reativarconquistas.rosidomingos032.workers.dev"

# SEGREDOS (nunca neste arquivo! cada um via `wrangler secret put NOME`):
#   wrangler secret put SECURITY_REWARD_EMAIL -> e-mail único do pesquisador reconhecido (9.999 dias)
#   wrangler secret put DEPIX_API_KEY        -> sk_test_... (teste) ou sk_live_... (produção)
#   wrangler secret put DEPIX_WEBHOOK_SECRET -> whsec_... (painel Depix > My Business > Webhooks)
#   wrangler secret put ABACATEPAY_API_KEY   -> abc_dev_... (dev) ou abc_... (produção, reserva)
#   wrangler secret put KIWIFY_SECRET        -> segredo presente no ?secret= da URL do webhook
#   wrangler secret put KIWIFY_TOKEN         -> token do header Kiwify, se o painel o enviar
# e cole cada valor quando o wrangler pedir (não aparece no terminal).
#
# MODO TESTE: com sk_test_ no DEPIX_API_KEY, o Worker já responde
# depix_test_mode=true no /api/config e o site mostra o aviso de teste.
# Simular pagamento aprovado: POST /api/depix/simulate {id: "chk_..."}.

