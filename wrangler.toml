# Configuração para provedores que executam o Wrangler na raiz do repositório.
# O código e a configuração detalhada continuam organizados em worker/.
name = "reativa-pay"
main = "worker/src/index.js"
compatibility_date = "2024-11-01"

[[durable_objects.bindings]]
name = "ENTITLEMENTS"
class_name = "EntitlementDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["EntitlementDO"]

[assets]
directory = "./site"
binding = "ASSETS"

[[kv_namespaces]]
binding = "PREMIUM_KV"
id = "acfc4981776e4dd0b8513722597f8f01"
preview_id = "acfc4981776e4dd0b8513722597f8f01"

[vars]
