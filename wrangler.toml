# Configuração para provedores que executam o Wrangler na raiz do repositório.
# O código e a configuração detalhada continuam organizados em worker/.
name = "reativa-pay"
main = "worker/src/index.js"
compatibility_date = "2024-11-01"

[[durable_objects.bindings]]
name = "ENTITLEMENTS"
class_name = "EntitlementDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["EntitlementDO"]

[assets]
directory = "./site"
binding = "ASSETS"

[[kv_namespaces]]
binding = "PREMIUM_KV"
id = "acfc4981776e4dd0b8513722597f8f01"
preview_id = "acfc4981776e4dd0b8513722597f8f01"

[vars]
# Firebase Web API key é pública e serve para validar o ID token Google no Worker.
FIREBASE_WEB_API_KEY = "AIzaSyBblhjZ2XRkjojhA-IHV_ISgW3Qs3Iq_JQ"
ABACATEPAY_PRODUCT_ID = "prod_ZC3tefGJJZtyGBPqyYdgq5Yk"
ABACATEPAY_PRODUCT_ID_24H = "prod_sfQEAQQcWr2P2UtJG4yqUsSq"
KIWIFY_PID_24H = ""
KIWIFY_PID_30D = ""
PUBLIC_BASE_URL = "https://reativarconquistas.pages.dev"
ALLOWED_ORIGINS = "https://reativarconquistas.pages.dev, *.reativarconquistas.pages.dev, https://reativarconquistas.rosidomingos032.workers.dev"
DEPIX_TEST_MODE = "0"
ADMIN_EMAILS = "ncmine75@gmail.com,rosidomingos032@gmail.com"

[triggers]
crons = ["*/5 * * * *"]
